flutter_launcher_icons:
  android: true
  ios: false

  # Source image for legacy (non-adaptive) icons on older Android
  image_path: "assets/images/icon_256.png"

  # Adaptive icon (Android 8.0+, API 26+)
  # The safe zone visible after circular crop is the inner 66% of the canvas.
  # adaptive_icon_foreground_inset adds padding (%) so content doesn't get clipped.
  # Default is 16%; increasing to 20% keeps the notification bell inside the circle.
  adaptive_icon_background: "#1a1a1a"
  adaptive_icon_foreground: "assets/images/icon_256.png"
  adaptive_icon_foreground_inset: 20

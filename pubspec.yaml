name: filmmaker_alerts
description: A Flutter port of Filmmaker Alerts.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Networking
  dio: ^5.7.0

  # Images
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1

  # Background & Notifications
  workmanager: ^0.9.0
  flutter_local_notifications: ^18.0.1
  windows_notification: ^1.3.0

  # Utilities
  intl: ^0.19.0
  path_provider: ^2.1.5
  flutter_dotenv: ^5.1.0
  shimmer: ^3.0.0
  url_launcher: ^6.3.2
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Debug/Development Tools
  flutter_phoenix: ^1.1.1

  # Code Generation for Hive
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  mockito: ^5.4.4
  hive_test: ^1.0.1
  http_mock_adapter: ^0.6.1

flutter:
  uses-material-design: true
  
  assets:
    - .env
    - assets/images/
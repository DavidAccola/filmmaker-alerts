<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filmmaker Alerts</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0d;
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }

    .hero {
      text-align: center;
      max-width: 560px;
    }

    .logo {
      width: 96px;
      height: 96px;
      border-radius: 12px;
      margin-bottom: 28px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    h1 {
      font-size: 2.6rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #ffffff 0%, #aaaaaa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .tagline {
      font-size: 1.15rem;
      color: #888;
      line-height: 1.6;
      margin-bottom: 36px;
    }

    .features {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 40px;
    }

    .feature {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 0.85rem;
      color: #aaa;
    }

    .feature span {
      margin-right: 6px;
    }

    .platforms {
      font-size: 0.9rem;
      color: #555;
      margin-bottom: 40px;
    }

    .footer {
      font-size: 0.82rem;
      color: #555;
    }

    .footer a {
      color: #666;
      text-decoration: none;
      border-bottom: 1px solid #333;
    }

    .footer a:hover { color: #999; }

    .divider {
      margin: 0 10px;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="hero">
    <img src="icon_256.png" alt="Filmmaker Alerts logo" class="logo">

    <h1>Filmmaker Alerts</h1>

    <p class="tagline">
      Follow the filmmakers you love. Get notified the moment their next project releases.
    </p>

    <div class="features">
      <div class="feature"><span>🎬</span>Track movies &amp; TV shows</div>
      <div class="feature"><span>🔔</span>Release notifications</div>
      <div class="feature"><span>⭐</span>Rate &amp; review</div>
      <div class="feature"><span>🔍</span>Discover new work</div>
      <div class="feature"><span>☁️</span>Sync across devices</div>
    </div>

    <div class="platforms">Available for Windows &nbsp;·&nbsp; Android coming soon</div>

    <div class="footer">
      <a href="privacy.html">Privacy Policy</a>
      <span class="divider">·</span>
      <a href="https://github.com/DavidAccola/filmmaker-alerts">GitHub</a>
    </div>
  </div>
</body>
</html>

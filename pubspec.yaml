name: filmmaker_alerts
description: A Flutter port of Filmmaker Alerts.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.2.0

  # Persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Networking
  dio: ^5.7.0

  # Images
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1

  # Background & Notifications
  workmanager: ^0.9.0
  flutter_local_notifications: ^20.0.0
  windows_notification: ^1.3.0

  # System Tray (Windows)
  tray_manager: ^0.5.2
  window_manager: ^0.5.1

  # Fonts
  google_fonts: ^6.2.1

  # Graph Visualization (plough removed — custom implementation used instead)

  # Google Drive Sync
  # google_sign_in_all_platforms handles Windows (loopback OAuth) + Android (native)
  # with a single unified API, built-in token persistence hooks, and authenticatedClient getter.
  # flutter_secure_storage persists OAuth tokens so users don't re-auth every launch.
  google_sign_in_all_platforms: ^2.0.3
  googleapis: ^14.0.0
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2

  # Utilities
  intl: ^0.20.2
  path_provider: ^2.1.5
  flutter_dotenv: ^6.0.0
  shimmer: ^3.0.0
  url_launcher: ^6.3.2
  collection: ^1.18.0

  # Icons
  material_symbols_icons: ^4.2719.3
  reorderable_grid_view: ^2.2.8
  sankey_flutter: ^0.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation for Hive
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  mockito: ^5.4.4
  hive_test: ^1.0.1
  http_mock_adapter: ^0.6.1
  glados: ^1.1.7

flutter:
  uses-material-design: true
  
  assets:
    - .env
    - assets/images/

dependency_overrides:
  # Patched locally to fix Dart 3.10 mixin compiler crash (reorderable_grid_mixin.dart).
  # The mixin 'on State<T>, TickerProviderStateMixin<T>' crashes the Dart 3.10 front-end;
  # patched to 'on TickerProviderStateMixin<T>' which implies State<T>.
  reorderable_grid_view:
    path: packages/reorderable_grid_view